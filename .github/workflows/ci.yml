name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev             libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev             libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev             libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
